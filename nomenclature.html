<html><head><script>
(function() {
  const STATS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyH4YmBCvc5sOrg_UJUfp9L7mgZtWHfB5cpKCkwGUfyHxkbhAbAqe1V3eFlBRHuBWvr/exec';
  const PROGRAMME = 'nomenclature';

  function getSessionId() {
    let id = sessionStorage.getItem('chimie_session_id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxxxxxx'.replace(/x/g, () => Math.floor(Math.random()*16).toString(16)));
      sessionStorage.setItem('chimie_session_id', id);
    }
    return id;
  }

  window.sendStat = function(evenement, detail, resultat, essais) {
    try {
      const payload = JSON.stringify({
        programme: PROGRAMME,
        session: getSessionId(),
        evenement: evenement,
        detail: detail || '',
        resultat: resultat || '',
        essais: essais !== undefined ? essais : ''
      });
      fetch(STATS_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payload
      }).catch(() => {});
    } catch (e) { /* on ignore silencieusement toute erreur reseau */ }
  };

  window.sendStatBeacon = function(evenement, detail, resultat) {
    try {
      const payload = JSON.stringify({
        programme: PROGRAMME,
        session: getSessionId(),
        evenement: evenement,
        detail: detail || '',
        resultat: resultat || ''
      });
      const blob = new Blob([payload], { type: 'text/plain;charset=utf-8' });
      navigator.sendBeacon(STATS_ENDPOINT, blob);
    } catch (e) {}
  };
})();
</script>

function shuffleQuestions() {
    // Mélange complet du stock de molécules (Fisher-Yates), puis on ne garde
    // que les QUESTIONS_PER_GAME premières : pas de répétition dans une partie.
    const indices = [...Array(molecules.length).keys()];
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    questionOrder = indices.slice(0, QUESTIONS_PER_GAME);
}

        const square = document.createElement('div');
        square.className = 'square';
        if(questionStatus[i] === 'correct') {
            square.classList.add('correct');
        } else if(questionStatus[i] === 'incorrect') {
            square.classList.add('incorrect');
        }
        if(i === questionNumber - 1) {
            square.classList.add('current');
        }
        square.textContent = i + 1;
        square.onclick = () => jumpToQuestion(i);
        container.appendChild(square);
    }
}

function jumpToQuestion(index) {
    if(index < questionNumber - 1) {
        questionNumber = index + 1;
        currentMolecule = index;
        attempts = 0;
        displayMolecule();
        updateProgressSquares();
    }
}

function displayMolecule() {
    document.getElementById('moleculeDisplay').innerHTML = molecules[questionOrder[currentMolecule]].svg;
    document.getElementById('questionNumber').textContent = questionNumber;
    document.getElementById('score').textContent = score;
    document.getElementById('answer').value = '';
    document.getElementById('feedback').textContent = '';
    updateProgressSquares();
    updateSummary();
}

function updateSummary() {
    const goodAnswers = questionStatus.filter(status => status === 'correct').length;
    const wrongAnswers = questionStatus.filter(status => status === 'incorrect').length;
    document.getElementById('goodAnswers').textContent = goodAnswers;
    document.getElementById('wrongAnswers').textContent = wrongAnswers;
    document.getElementById('multipleAttempts').textContent = multipleAttemptsCount;
}

function normalizeAnswer(str) {
    return str
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // retire les accents
        .replace(/[^a-z0-9]/g, ''); // retire espaces, apostrophes, parenthèses, tirets...
}

function checkAnswer() {
    const userAnswer = normalizeAnswer(document.getElementById('answer').value);
    const correctAnswer = molecules[questionOrder[currentMolecule]].name;
    const alternateAnswers = molecules[questionOrder[currentMolecule]].alternates;
    
    if (userAnswer === normalizeAnswer(correctAnswer) || alternateAnswers.some(alt => normalizeAnswer(alt) === userAnswer)) {
        document.getElementById('feedback').innerHTML = 'Correct! ✅';
        document.getElementById('feedback').className = 'feedback correct';
        questionStatus[questionNumber - 1] = 'correct';
        attemptsPerQuestion[questionNumber - 1] = attempts;
        sendStat('reponse', correctAnswer, attempts === 0 ? 'premier_coup' : 'apres_essais', attempts);
        if(!answeredQuestions[questionNumber - 1]) {
            score++;
            answeredQuestions[questionNumber - 1] = true;
            if (attempts > 0) {
                multipleAttemptsCount++;
            }
        }
        nextMolecule();
    } else {
        attempts++;
        if (attempts >= 3) {
            document.getElementById('feedback').innerHTML = `Incorrect. La bonne réponse était: ${correctAnswer}`;
            document.getElementById('feedback').className = 'feedback incorrect';
            questionStatus[questionNumber - 1] = 'incorrect';
            sendStat('reponse', correctAnswer, 'echec', attempts);
            nextMolecule();
        } else {
            document.getElementById('feedback').innerHTML = `Incorrect. Il vous reste ${3-attempts} essai(s).`;
            document.getElementById('feedback').className = 'feedback incorrect';
        }
    }
    document.getElementById('score').textContent = score;
    updateProgressSquares();
    updateSummary();
}

function nextMolecule() {
    attempts = 0;
    currentMolecule++;
    questionNumber++;
    
    if (questionNumber > TOTAL_QUESTIONS) {
        finishGame();
    } else {
        displayMolecule();
    }
}

function finishGame() {
    gameFinished = true;
    sendStat('fin', `${score}/${TOTAL_QUESTIONS}`, '', '');
    const goodAnswers = questionStatus.filter(status => status === 'correct').length;
    const wrongAnswers = questionStatus.filter(status => status === 'incorrect').length;

    const missedNames = [];
    const shakyNames = [];
    for (let i = 0; i < questionOrder.length; i++) {
        if (questionStatus[i] === 'incorrect') {
            missedNames.push(molecules[questionOrder[i]].name);
        } else if (questionStatus[i] === 'correct' && attemptsPerQuestion[i] > 0) {
            shakyNames.push(molecules[questionOrder[i]].name);
        }
    }

    const missedListHtml = missedNames.length > 0
        ? `<div class="missed-review">
             <h3>À revoir (erreur non corrigée) :</h3>
             <ul>${missedNames.map(name => `<li>${name}</li>`).join('')}</ul>
           </div>`
        : '';

    const shakyListHtml = shakyNames.length > 0
        ? `<div class="missed-review">
             <h3>Réussies après une ou deux erreurs :</h3>
             <ul>${shakyNames.map(name => `<li>${name}</li>`).join('')}</ul>
           </div>`
        : '';

    const noIssuesHtml = (missedNames.length === 0 && shakyNames.length === 0)
        ? '<p>Aucune erreur, bravo !</p>'
        : '';

    document.querySelector('.container').innerHTML = `
        <h1>Quiz Terminé!</h1>
        <div class="stats">
            <p>Score final: ${score}/${TOTAL_QUESTIONS}</p>
            <p>Bonnes réponses: ${goodAnswers}</p>
            <p>Mauvaises réponses: ${wrongAnswers}</p>
            <p>Réponses avec plusieurs essais: ${multipleAttemptsCount}</p>
        </div>
        ${missedListHtml}
        ${shakyListHtml}
        ${noIssuesHtml}
        <button onclick="location.reload()">Rejouer</button>
    `;
}

document.getElementById('answer').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkAnswer();
    }
});

shuffleQuestions();
let gameFinished = false;
sendStat('start', `${TOTAL_QUESTIONS} questions`, '', '');
window.addEventListener('pagehide', function() {
    if (!gameFinished) {
        sendStatBeacon('abandon', `question ${questionNumber}/${TOTAL_QUESTIONS}`, '');
    }
});
document.getElementById('totalQuestionsDisplay').textContent = TOTAL_QUESTIONS;
displayMolecule();
updateSummary();
</script>
